<svg role="img" aria-label="Hook events in a single-agent invocation. Request start: BeforeInvocation. Then the agent loop. Model call: BeforeModelCall, AfterModelCall. If the model makes tool calls, tool execution runs: BeforeTools; then, for each tool call, BeforeToolCall and AfterToolCall; then AfterTools, whose results go back to the model for the next model call. When the model makes no tool calls, the loop exits to request end: AfterInvocation." xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 528" width="720" height="528">
  <style>
    .zone { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
    .eyebrow { font: 600 10px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 0.08em; fill: #57606a; }
    .node { fill: #ffffff; stroke: #8c959f; stroke-width: 1; }
    .code { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
    .edge { fill: none; stroke: #57606a; stroke-width: 1.5; }
    .head { fill: #57606a; }
    .label { font: 600 9px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 0.06em; fill: #57606a; }
    .mask { fill: #f6f8fa; }
    @media (prefers-color-scheme: dark) {
      .zone { fill: #161b22; stroke: #30363d; }
      .eyebrow, .label { fill: #8b949e; }
      .node { fill: #0d1117; stroke: #6e7681; }
      .code { fill: #e6edf3; }
      .edge { stroke: #8b949e; }
      .head { fill: #8b949e; }
      .mask { fill: #161b22; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 8 6" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path class="head" d="M0,0 L8,3 L0,6 Z"/>
    </marker>
  </defs>

  <!-- zones -->
  <rect class="zone" x="80" y="16" width="208" height="76" rx="8"/>
  <text class="eyebrow" x="96" y="36">REQUEST START</text>

  <rect class="zone" x="64" y="116" width="592" height="296" rx="8"/>
  <text class="eyebrow" x="80" y="136">AGENT LOOP</text>

  <rect class="zone" x="80" y="152" width="208" height="116" rx="8"/>
  <text class="eyebrow" x="96" y="172">MODEL CALL</text>

  <rect class="zone" x="400" y="152" width="240" height="244" rx="8"/>
  <text class="eyebrow" x="416" y="172">TOOL EXECUTION</text>
  <rect class="zone" x="416" y="224" width="208" height="116" rx="4"/>
  <text class="eyebrow" x="432" y="244">EACH TOOL CALL</text>

  <rect class="zone" x="80" y="436" width="208" height="76" rx="8"/>
  <text class="eyebrow" x="96" y="456">REQUEST END</text>

  <!-- edges -->
  <path class="edge" d="M184,92 V150" marker-end="url(#arrow)"/>
  <path class="edge" d="M288,208 H398" marker-end="url(#arrow)"/>
  <path class="edge" d="M400,248 H290" marker-end="url(#arrow)"/>
  <path class="edge" d="M184,268 V434" marker-end="url(#arrow)"/>

  <!-- edge labels -->
  <rect class="mask" x="304" y="188" width="80" height="12" rx="2"/>
  <text class="label" x="344" y="197" text-anchor="middle">TOOL CALLS</text>
  <rect class="mask" x="314" y="228" width="60" height="12" rx="2"/>
  <text class="label" x="344" y="237" text-anchor="middle">RESULTS</text>
  <text class="label" x="196" y="352">NO TOOL CALLS</text>

  <!-- events -->
  <rect class="node" x="96" y="48" width="176" height="28" rx="6"/>
  <text class="code" x="184" y="66" text-anchor="middle">BeforeInvocation</text>

  <rect class="node" x="96" y="184" width="176" height="28" rx="6"/>
  <text class="code" x="184" y="202" text-anchor="middle">BeforeModelCall</text>
  <rect class="node" x="96" y="224" width="176" height="28" rx="6"/>
  <text class="code" x="184" y="242" text-anchor="middle">AfterModelCall</text>

  <rect class="node" x="432" y="184" width="176" height="28" rx="6"/>
  <text class="code" x="520" y="202" text-anchor="middle">BeforeTools</text>
  <rect class="node" x="432" y="256" width="176" height="28" rx="6"/>
  <text class="code" x="520" y="274" text-anchor="middle">BeforeToolCall</text>
  <rect class="node" x="432" y="296" width="176" height="28" rx="6"/>
  <text class="code" x="520" y="314" text-anchor="middle">AfterToolCall</text>
  <rect class="node" x="432" y="352" width="176" height="28" rx="6"/>
  <text class="code" x="520" y="370" text-anchor="middle">AfterTools</text>

  <rect class="node" x="96" y="468" width="176" height="28" rx="6"/>
  <text class="code" x="184" y="486" text-anchor="middle">AfterInvocation</text>
</svg>
